<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RTA - リアルタイムアナライザー</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#111;--bg2:#1a1a1a;--bg3:#242424;
    --text:#f0f0f0;--text2:#aaa;--text3:#666;
    --border:#333;
    --green:#1D9E75;--amber:#EF9F27;--red:#E24B4A;
    --teal:#5DCAA5;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;overflow-x:hidden}
  #app{display:flex;flex-direction:column;gap:10px;padding:12px;max-width:600px;margin:0 auto}
  h1{font-size:16px;font-weight:500;color:var(--text);letter-spacing:0.05em;text-align:center;padding:8px 0 4px}
  .card{background:var(--bg2);border-radius:12px;padding:12px}
  .label{font-size:11px;color:var(--text3);margin-bottom:6px;letter-spacing:0.06em;text-transform:uppercase}

  /* メーターグリッド */
  #meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .metric{background:var(--bg3);border-radius:10px;padding:10px}
  .metric .lbl{font-size:10px;color:var(--text3);margin-bottom:4px;letter-spacing:0.05em}
  .metric .val{font-size:20px;font-weight:500;line-height:1;color:var(--text)}
  .metric .unit{font-size:10px;color:var(--text3);margin-left:1px}

  /* SPLバー */
  #spl-track{width:100%;height:18px;background:var(--bg3);border-radius:9px;overflow:hidden;position:relative}
  #spl-fill{height:100%;width:0%;background:var(--green);border-radius:9px;transition:width 0.12s,background 0.12s}
  #spl-peak-marker{position:absolute;top:2px;bottom:2px;width:3px;border-radius:2px;background:var(--red);transition:left 0.1s}

  /* スペクトラム */
  canvas{width:100%;display:block;border-radius:8px;background:var(--bg3)}

  /* コントロール */
  #controls{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
  #start-btn{flex:1;min-width:140px;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:15px;font-weight:500;cursor:pointer;transition:background 0.15s,border 0.15s}
  #start-btn.active{background:var(--green);border-color:var(--green);color:#fff}
  .ctrl-group{background:var(--bg3);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
  select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:13px}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
  label{cursor:pointer;font-size:13px;color:var(--text2)}

  /* ゲインスライダー */
  #gain-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}
  input[type=range]{flex:1;accent-color:var(--teal)}

  #status{font-size:11px;color:var(--text3);text-align:center;padding:2px 0}

  /* 凡例 */
  #legend{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--text3)}
  .legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
</style>
</head>
<body>
<div id="app">
  <h1>RTA リアルタイムアナライザー</h1>

  <div id="controls">
    <button id="start-btn" onclick="toggleMic()">マイク開始</button>
    <div class="ctrl-group">
      <span>FFT</span>
      <select id="fft-size" onchange="changeFFT(this.value)">
        <option value="2048">2048</option>
        <option value="4096" selected>4096</option>
        <option value="8192">8192</option>
      </select>
    </div>
    <div class="ctrl-group">
      <input type="checkbox" id="peak-hold" checked>
      <label for="peak-hold">ピークホールド</label>
    </div>
  </div>

  <div id="meters">
    <div class="metric">
      <div class="lbl">SPL</div>
      <div><span class="val" id="spl-val">--</span><span class="unit">dB</span></div>
    </div>
    <div class="metric">
      <div class="lbl">ピーク</div>
      <div><span class="val" id="peak-val">--</span><span class="unit">dB</span></div>
    </div>
    <div class="metric">
      <div class="lbl">ピーク周波数</div>
      <div><span class="val" id="freq-val">--</span><span class="unit">Hz</span></div>
    </div>
  </div>

  <div class="card">
    <div class="label">音圧レベル（0 〜 100 dB）</div>
    <div id="spl-track">
      <div id="spl-fill"></div>
      <div id="spl-peak-marker"></div>
    </div>
  </div>

  <div class="card">
    <div class="label" style="display:flex;justify-content:space-between">
      <span>周波数スペクトラム（1/3 オクターブバンド）</span>
      <span id="sr-label" style="font-size:10px;color:var(--text3)"></span>
    </div>
    <canvas id="fft-canvas" height="200"></canvas>
  </div>

  <div class="card">
    <div class="label">感度補正（ゲイン）</div>
    <div id="gain-row">
      <span>-20dB</span>
      <input type="range" id="gain-slider" min="-20" max="20" value="0" step="1" oninput="updateGain(this.value)">
      <span>+20dB</span>
      <span id="gain-val" style="min-width:36px;text-align:right;font-weight:500;color:var(--text)">0 dB</span>
    </div>
  </div>

  <div id="legend">
    <span><span class="legend-dot" style="background:var(--green)"></span>正常</span>
    <span><span class="legend-dot" style="background:var(--amber)"></span>やや大</span>
    <span><span class="legend-dot" style="background:var(--red)"></span>大</span>
  </div>

  <div id="status">マイク開始ボタンを押してください</div>
</div>

<script>
const BANDS=[50,63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000];

let audioCtx=null,analyser=null,stream=null,gainNode=null;
let running=false,raf=null;
let peakDB=-Infinity,peakTime=0;
let gainDB=0;

const canvas=document.getElementById('fft-canvas');
const ctx2d=canvas.getContext('2d');

function resizeCanvas(){
  const w=canvas.parentElement.clientWidth-24;
  canvas.width=Math.floor(w*devicePixelRatio);
  canvas.height=Math.floor(200*devicePixelRatio);
  canvas.style.width=w+'px';
  canvas.style.height='200px';
}
resizeCanvas();
window.addEventListener('resize',()=>{resizeCanvas();});

function updateGain(v){
  gainDB=parseInt(v);
  document.getElementById('gain-val').textContent=(gainDB>=0?'+':'')+gainDB+' dB';
  if(gainNode){gainNode.gain.value=Math.pow(10,gainDB/20);}
}

async function toggleMic(){
  if(running){stopMic();return;}
  try{
    document.getElementById('status').textContent='マイク権限を要求中...';
    const constraints={audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}};
    stream=await navigator.mediaDevices.getUserMedia(constraints);
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream);
    gainNode=audioCtx.createGain();
    gainNode.gain.value=Math.pow(10,gainDB/20);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=parseInt(document.getElementById('fft-size').value);
    analyser.smoothingTimeConstant=0.75;
    src.connect(gainNode);
    gainNode.connect(analyser);
    running=true;
    document.getElementById('start-btn').textContent='停止';
    document.getElementById('start-btn').classList.add('active');
    document.getElementById('sr-label').textContent=audioCtx.sampleRate/1000+'kHz';
    document.getElementById('status').textContent='測定中';
    loop();
  }catch(e){
    document.getElementById('status').textContent='マイクアクセス失敗: '+e.message;
  }
}

function stopMic(){
  running=false;
  cancelAnimationFrame(raf);
  stream&&stream.getTracks().forEach(t=>t.stop());
  audioCtx&&audioCtx.close();
  audioCtx=null;analyser=null;gainNode=null;
  peakDB=-Infinity;
  document.getElementById('start-btn').textContent='マイク開始';
  document.getElementById('start-btn').classList.remove('active');
  document.getElementById('status').textContent='停止しました';
  document.getElementById('spl-val').textContent='--';
  document.getElementById('peak-val').textContent='--';
  document.getElementById('freq-val').textContent='--';
  document.getElementById('spl-fill').style.width='0%';
  drawEmpty();
}

function changeFFT(v){
  if(analyser)analyser.fftSize=parseInt(v);
}

function loop(){
  if(!running)return;
  raf=requestAnimationFrame(loop);
  const bufLen=analyser.frequencyBinCount;
  const data=new Float32Array(bufLen);
  analyser.getFloatFrequencyData(data);
  const sr=audioCtx.sampleRate;
  const binHz=sr/analyser.fftSize;

  let sumSq=0,cnt=0,maxDb=-Infinity,maxBin=0;
  for(let i=0;i<bufLen;i++){
    const d=data[i];
    if(isFinite(d)&&d>-Infinity){
      const lin=Math.pow(10,d/20);
      sumSq+=lin*lin;cnt++;
      if(d>maxDb){maxDb=d;maxBin=i;}
    }
  }
  const rmsDb=cnt>0?20*Math.log10(Math.sqrt(sumSq/cnt)):-100;
  const displayDb=Math.max(0,Math.min(100,rmsDb+100));
  const pct=(displayDb/100)*100;

  document.getElementById('spl-val').textContent=displayDb.toFixed(1);
  const fill=document.getElementById('spl-fill');
  fill.style.width=pct.toFixed(1)+'%';
  fill.style.background=pct>85?'var(--red)':pct>65?'var(--amber)':'var(--green)';

  const now=Date.now();
  if(document.getElementById('peak-hold').checked){
    if(rmsDb>peakDB){peakDB=rmsDb;peakTime=now;}
    else if(now-peakTime>2000)peakDB=rmsDb;
  }else{peakDB=rmsDb;}
  const peakDisplay=Math.max(0,Math.min(100,peakDB+100));
  const peakPct=(peakDisplay/100)*100;
  document.getElementById('spl-peak-marker').style.left=peakPct.toFixed(1)+'%';
  document.getElementById('peak-val').textContent=peakDisplay.toFixed(1);

  const peakHz=Math.round(maxBin*binHz);
  document.getElementById('freq-val').textContent=peakHz>=10000?(peakHz/1000).toFixed(1)+'k':peakHz;

  drawSpectrum(data,bufLen,binHz);
}

function drawEmpty(){
  const W=canvas.width,H=canvas.height;
  ctx2d.clearRect(0,0,W,H);
  ctx2d.fillStyle='#242424';
  ctx2d.fillRect(0,0,W,H);
}

function drawSpectrum(data,bufLen,binHz){
  const W=canvas.width,H=canvas.height;
  const dpr=devicePixelRatio;
  ctx2d.clearRect(0,0,W,H);
  ctx2d.fillStyle='#242424';
  ctx2d.fillRect(0,0,W,H);

  const dbMin=-100,dbMax=0;

  ctx2d.strokeStyle='rgba(255,255,255,0.06)';
  ctx2d.lineWidth=1;
  for(let db=-90;db<=0;db+=10){
    const y=H-(db-dbMin)/(dbMax-dbMin)*H;
    ctx2d.beginPath();ctx2d.moveTo(0,y);ctx2d.lineTo(W,y);ctx2d.stroke();
    const label=(db+100)+'dB';
    ctx2d.fillStyle='rgba(255,255,255,0.25)';
    ctx2d.font=`${9*dpr}px -apple-system,sans-serif`;
    ctx2d.fillText(label,4*dpr,y-3*dpr);
  }

  const bandCount=BANDS.length;
  const barW=Math.max(2,Math.floor(W/bandCount)-2);
  const step=W/bandCount;

  for(let b=0;b<bandCount;b++){
    const fMid=BANDS[b];
    const fLow=fMid/Math.sqrt(2);
    const fHigh=fMid*Math.sqrt(2);
    const binLow=Math.max(0,Math.floor(fLow/binHz));
    const binHigh=Math.min(bufLen-1,Math.ceil(fHigh/binHz));
    let maxVal=-Infinity;
    for(let i=binLow;i<=binHigh;i++){if(data[i]>maxVal)maxVal=data[i];}
    if(!isFinite(maxVal))maxVal=dbMin;
    const db=Math.max(dbMin,Math.min(dbMax,maxVal));
    const barH=(db-dbMin)/(dbMax-dbMin)*H;
    const x=Math.floor(b*step);
    const norm=(db-dbMin)/(dbMax-dbMin);

    let r,g,bl;
    if(norm>0.85){r=226;g=74;bl=74;}
    else if(norm>0.6){r=239;g=159;bl=39;}
    else{r=29;g=158;bl=117;}
    ctx2d.fillStyle=`rgb(${r},${g},${bl})`;
    ctx2d.fillRect(x+1,H-barH,barW,barH);

    const label=fMid>=1000?(fMid/1000).toFixed(fMid>=10000?0:1)+'k':String(fMid);
    ctx2d.fillStyle='rgba(255,255,255,0.3)';
    ctx2d.font=`${7.5*dpr}px -apple-system,sans-serif`;
    ctx2d.textAlign='center';
    ctx2d.fillText(label,x+barW/2,H-3*dpr);
    ctx2d.textAlign='left';
  }
}

drawEmpty();

if('serviceWorker' in navigator){
  const sw=`
self.addEventListener('install',e=>e.waitUntil(
  caches.open('rta-v1').then(c=>c.addAll([location.pathname]))
));
self.addEventListener('fetch',e=>e.respondWith(
  caches.match(e.request).then(r=>r||fetch(e.request))
));`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
