<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RTA - リアルタイムアナライザー</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#111;--bg2:#1a1a1a;--bg3:#242424;
    --text:#f0f0f0;--text2:#aaa;--text3:#666;
    --border:#333;
    --green:#1D9E75;--amber:#EF9F27;--red:#E24B4A;
    --teal:#5DCAA5;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;overflow-x:hidden}
  #app{display:flex;flex-direction:column;gap:10px;padding:12px;max-width:600px;margin:0 auto}
  h1{font-size:16px;font-weight:500;color:var(--text);letter-spacing:0.05em;text-align:center;padding:8px 0 4px}
  .card{background:var(--bg2);border-radius:12px;padding:12px}
  .label{font-size:11px;color:var(--text3);margin-bottom:6px;letter-spacing:0.06em;text-transform:uppercase}

  /* SPLメーター（縦長） */
  #spl-section{display:flex;gap:10px;align-items:stretch}
  #spl-meter-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:56px}
  #spl-meter-label{font-size:10px;color:var(--text3);letter-spacing:0.05em}
  #spl-track-v{flex:1;width:28px;background:var(--bg3);border-radius:14px;overflow:hidden;position:relative;min-height:160px}
  #spl-fill-v{position:absolute;bottom:0;left:0;right:0;height:0%;background:var(--green);border-radius:14px;transition:height 0.12s,background 0.12s}
  #spl-val-wrap{font-size:24px;font-weight:500;color:var(--text);text-align:center;line-height:1}
  #spl-val-unit{font-size:11px;color:var(--text3);text-align:center}

  /* スペクトラム */
  #canvas-wrap{flex:1}
  canvas{width:100%;display:block;border-radius:8px;background:#f8f8f8}

  /* コントロール */
  #controls{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
  #start-btn{flex:1;min-width:140px;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:15px;font-weight:500;cursor:pointer;transition:background 0.15s,border 0.15s}
  #start-btn.active{background:var(--green);border-color:var(--green);color:#fff}
  .ctrl-group{background:var(--bg3);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
  select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:13px}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
  label{cursor:pointer;font-size:13px;color:var(--text2)}

  /* ゲインスライダー */
  #gain-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}
  input[type=range]{flex:1;accent-color:var(--teal)}

  #status{font-size:11px;color:var(--text3);text-align:center;padding:2px 0}
</style>
</head>
<body>
<div id="app">
  <h1>RTA リアルタイムアナライザー</h1>

  <div id="controls">
    <button id="start-btn" onclick="toggleMic()">マイク開始</button>
    <div class="ctrl-group">
      <span>FFT</span>
      <select id="fft-size" onchange="changeFFT(this.value)">
        <option value="2048">2048</option>
        <option value="4096" selected>4096</option>
        <option value="8192">8192</option>
      </select>
    </div>
  </div>

  <!-- SPL縦メーター ＋ スペクトラム 横並び -->
  <div class="card">
    <div id="spl-section">
      <div id="spl-meter-wrap">
        <div id="spl-meter-label">SPL</div>
        <div id="spl-track-v">
          <div id="spl-fill-v"></div>
        </div>
        <div id="spl-val-wrap"><span id="spl-val">--</span></div>
        <div id="spl-val-unit">dB</div>
      </div>
      <div id="canvas-wrap">
        <canvas id="fft-canvas"></canvas>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label">感度補正（ゲイン）</div>
    <div id="gain-row">
      <span>-20dB</span>
      <input type="range" id="gain-slider" min="-20" max="20" value="0" step="1" oninput="updateGain(this.value)">
      <span>+20dB</span>
      <span id="gain-val" style="min-width:36px;text-align:right;font-weight:500;color:var(--text)">0 dB</span>
    </div>
  </div>

  <div id="status">マイク開始ボタンを押してください</div>
</div>

<script>
const BANDS=[40,63,100,160,250,400,630,1000,1600,2500,4000,6300,10000,16000];
const BAND_LABELS=['40','63','100','160','250','400','630','1k','1.6k','2.5k','4k','6.3k','10k','16k'];
const DB_DISPLAY_MIN=0,DB_DISPLAY_MAX=120;
const DB_INTERNAL_MIN=-100,DB_INTERNAL_MAX=20;

let audioCtx=null,analyser=null,stream=null,gainNode=null;
let running=false,raf=null;
let gainDB=0;

const canvas=document.getElementById('fft-canvas');
const ctx2d=canvas.getContext('2d');

function resizeCanvas(){
  const wrap=document.getElementById('canvas-wrap');
  const w=wrap.clientWidth;
  // canvasの高さをSPLメーターに合わせて縦長に
  const splWrap=document.getElementById('spl-track-v');
  const h=splWrap.clientHeight||300;
  canvas.width=Math.floor(w*devicePixelRatio);
  canvas.height=Math.floor(h*devicePixelRatio);
  canvas.style.width=w+'px';
  canvas.style.height=h+'px';
}

// SPLメーターの高さをウィンドウに応じて設定
function setSplHeight(){
  const vh=window.innerHeight;
  const targetH=Math.max(260,Math.floor(vh*0.75));
  document.getElementById('spl-track-v').style.minHeight=targetH+'px';
  resizeCanvas();
}

setSplHeight();
window.addEventListener('resize',()=>{setSplHeight();drawEmpty();});

function updateGain(v){
  gainDB=parseInt(v);
  document.getElementById('gain-val').textContent=(gainDB>=0?'+':'')+gainDB+' dB';
  if(gainNode){gainNode.gain.value=Math.pow(10,gainDB/20);}
}

async function toggleMic(){
  if(running){stopMic();return;}
  try{
    document.getElementById('status').textContent='マイク権限を要求中...';
    const constraints={audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}};
    stream=await navigator.mediaDevices.getUserMedia(constraints);
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream);
    gainNode=audioCtx.createGain();
    gainNode.gain.value=Math.pow(10,gainDB/20);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=parseInt(document.getElementById('fft-size').value);
    analyser.smoothingTimeConstant=0.75;
    src.connect(gainNode);
    gainNode.connect(analyser);
    running=true;
    document.getElementById('start-btn').textContent='停止';
    document.getElementById('start-btn').classList.add('active');
    document.getElementById('status').textContent='測定中 '+audioCtx.sampleRate/1000+'kHz';
    loop();
  }catch(e){
    document.getElementById('status').textContent='マイクアクセス失敗: '+e.message;
  }
}

function stopMic(){
  running=false;
  cancelAnimationFrame(raf);
  stream&&stream.getTracks().forEach(t=>t.stop());
  audioCtx&&audioCtx.close();
  audioCtx=null;analyser=null;gainNode=null;
  document.getElementById('start-btn').textContent='マイク開始';
  document.getElementById('start-btn').classList.remove('active');
  document.getElementById('status').textContent='停止しました';
  document.getElementById('spl-val').textContent='--';
  document.getElementById('spl-fill-v').style.height='0%';
  drawEmpty();
}

function changeFFT(v){
  if(analyser)analyser.fftSize=parseInt(v);
}

function toDisplayDb(internalDb){
  return Math.max(0,Math.min(120,(internalDb-DB_INTERNAL_MIN)/(DB_INTERNAL_MAX-DB_INTERNAL_MIN)*120));
}

function loop(){
  if(!running)return;
  raf=requestAnimationFrame(loop);
  const bufLen=analyser.frequencyBinCount;
  const data=new Float32Array(bufLen);
  analyser.getFloatFrequencyData(data);
  const sr=audioCtx.sampleRate;
  const binHz=sr/analyser.fftSize;

  let sumSq=0,cnt=0;
  for(let i=0;i<bufLen;i++){
    const d=data[i];
    if(isFinite(d)){const lin=Math.pow(10,d/20);sumSq+=lin*lin;cnt++;}
  }
  const rmsDb=cnt>0?20*Math.log10(Math.sqrt(sumSq/cnt)):-100;
  const displayDb=toDisplayDb(rmsDb);
  const pct=displayDb/120*100;

  document.getElementById('spl-val').textContent=displayDb.toFixed(1);
  const fill=document.getElementById('spl-fill-v');
  fill.style.height=pct.toFixed(1)+'%';
  fill.style.background=pct>85?'var(--red)':pct>65?'var(--amber)':'var(--green)';

  drawSpectrum(data,bufLen,binHz);
}

function dbToY(db,plotH,plotTop){
  const disp=toDisplayDb(db);
  return plotTop+plotH*(1-disp/DB_DISPLAY_MAX);
}

function drawEmpty(){
  resizeCanvas();
  const W=canvas.width,H=canvas.height;
  ctx2d.clearRect(0,0,W,H);
  drawGrid(W,H,null,0,0);
}

function drawGrid(W,H,data,bufLen,binHz){
  const dpr=devicePixelRatio;
  const leftMargin=Math.floor(34*dpr);
  const bottomMargin=Math.floor(16*dpr);
  const plotW=W-leftMargin;
  const plotH=H-bottomMargin;
  const plotTop=0;

  ctx2d.fillStyle='#f8f8f8';
  ctx2d.fillRect(0,0,W,H);

  // 2dBごと細グリッド
  ctx2d.strokeStyle='rgba(0,0,0,0.07)';
  ctx2d.lineWidth=0.5;
  for(let db=0;db<=120;db+=2){
    const y=plotTop+plotH*(1-db/120);
    ctx2d.beginPath();ctx2d.moveTo(leftMargin,y);ctx2d.lineTo(W,y);ctx2d.stroke();
  }

  // 10dBごと太グリッド＋ラベル
  ctx2d.strokeStyle='rgba(0,0,0,0.18)';
  ctx2d.lineWidth=1;
  ctx2d.fillStyle='rgba(0,0,0,0.55)';
  ctx2d.font=`bold ${9*dpr}px -apple-system,sans-serif`;
  ctx2d.textAlign='right';
  for(let db=0;db<=120;db+=10){
    const y=plotTop+plotH*(1-db/120);
    ctx2d.beginPath();ctx2d.moveTo(leftMargin,y);ctx2d.lineTo(W,y);ctx2d.stroke();
    ctx2d.fillText(String(db),leftMargin-3*dpr,y+3*dpr);
  }
  ctx2d.textAlign='left';

  ctx2d.fillStyle='rgba(0,0,0,0.4)';
  ctx2d.font=`${8*dpr}px -apple-system,sans-serif`;
  ctx2d.fillText('dB',2*dpr,10*dpr);

  if(!data||bufLen===0){
    ctx2d.fillText('freq',leftMargin,H-2*dpr);
    return;
  }

  // 各バンドの集計境界を対数中間点で計算
  const boundaries=[];
  boundaries.push(BANDS[0]/Math.sqrt(BANDS[1]/BANDS[0])); // 左端
  for(let b=0;b<BANDS.length-1;b++){
    boundaries.push(Math.sqrt(BANDS[b]*BANDS[b+1])); // 対数中間点
  }
  boundaries.push(BANDS[BANDS.length-1]*Math.sqrt(BANDS[BANDS.length-1]/BANDS[BANDS.length-2])); // 右端

  // バー描画
  const bandCount=BANDS.length;
  const barW=Math.max(2,Math.floor(plotW/bandCount)-2);
  const step=plotW/bandCount;

  for(let b=0;b<bandCount;b++){
    const fLow=boundaries[b];
    const fHigh=boundaries[b+1];
    const binLow=Math.max(0,Math.floor(fLow/binHz));
    const binHigh=Math.min(bufLen-1,Math.ceil(fHigh/binHz));
    let maxVal=-Infinity;
    for(let i=binLow;i<=binHigh;i++){if(data[i]>maxVal)maxVal=data[i];}
    if(!isFinite(maxVal))maxVal=DB_INTERNAL_MIN;
    const db=Math.max(DB_INTERNAL_MIN,Math.min(DB_INTERNAL_MAX,maxVal));
    const y=dbToY(db,plotH,plotTop);
    const barBottom=plotTop+plotH;
    const x=leftMargin+Math.floor(b*step);

    ctx2d.fillStyle='rgba(60,100,220,0.85)';
    ctx2d.fillRect(x+1,y,barW,barBottom-y);

    const label=BAND_LABELS[b];
    ctx2d.fillStyle='rgba(0,0,0,0.35)';
    ctx2d.font=`${7*dpr}px -apple-system,sans-serif`;
    ctx2d.textAlign='center';
    ctx2d.fillText(label,x+barW/2,H-2*dpr);
    ctx2d.textAlign='left';
  }

  ctx2d.fillStyle='rgba(0,0,0,0.4)';
  ctx2d.font=`${8*dpr}px -apple-system,sans-serif`;
  ctx2d.fillText('freq',leftMargin,H-2*dpr);
}

function drawSpectrum(data,bufLen,binHz){
  const W=canvas.width,H=canvas.height;
  ctx2d.clearRect(0,0,W,H);
  drawGrid(W,H,data,bufLen,binHz);
}

drawEmpty();

if('serviceWorker' in navigator){
  const sw=`
self.addEventListener('install',e=>e.waitUntil(
  caches.open('rta-v1').then(c=>c.addAll([location.pathname]))
));
self.addEventListener('fetch',e=>e.respondWith(
  caches.match(e.request).then(r=>r||fetch(e.request))
));`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
